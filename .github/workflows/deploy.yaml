name: Build and Deploy to Elastic Beanstalk

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Publish (self-contained linux-x64)
        run: dotnet publish InlamningAPI.csproj -c Release -r linux-x64 --self-contained true -o publish

         - name: Prepare bundle (Procfile + permissions)
        run: |
          cp Procfile publish/Procfile
          chmod +x publish/InlamningAPI

      - name: Create zip for deployment
        run: |
          cd publish
          zip -r ../app.zip .

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: "InlamningAPI"
          environment_name: "InlamningAPI-env"
          region: "eu-north-1"
          version_label: ${{ github.run_id }}
          deployment_package: app.zip